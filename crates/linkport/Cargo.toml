[package]
name = "linkport"
description = "Linkport: rule-based browser router with a web portal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "linkport"

[[bin]]
# The app itself (Windows GUI subsystem, windowless): OS-facing URL
# handler, portal daemon + tray ("serve" or no arguments).
name = "linkport"
path = "src/bin/linkport.rs"

[[bin]]
# Terminal tool: test, register, browsers, portal-url, dev-mode serve.
name = "linkport-cli"
path = "src/bin/linkport_cli.rs"

[dependencies]
linkport-core = { workspace = true }
linkport-win = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { workspace = true }
windows-sys = { workspace = true }

[build-dependencies]
# Embeds resources/icon.ico into the exes (Settings/Start-menu icons);
# cross-compiled via mingw windres.
winresource = "0.1"
