# Continuous integration: format check, unit tests, the Windows
# cross-compile check and the portal build — on every push and PR.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - name: Install mingw-w64 (windows-gnu cross-linking)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format check
        run: cargo fmt --all --check

      - name: Unit tests
        run: cargo test --workspace

      - name: Windows target check
        run: cargo check --target x86_64-pc-windows-gnu --workspace --all-targets

      - name: Build portal (static export, type-checks the frontend)
        run: |
          cd frontend
          npm ci
          npm run build
